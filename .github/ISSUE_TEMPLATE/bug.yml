name: Bug report
description: agentaudit missed a capability, failed to run, or behaved unexpectedly.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        For a finding that should not have been reported, use the false positive form instead.
        For a security vulnerability, do not open an issue: follow [SECURITY.md](https://github.com/manifold-security/agentaudit/blob/main/SECURITY.md).
  - type: textarea
    id: configuration
    attributes:
      label: Configuration
      description: "The configuration that produced the result: each file's path relative to the repository root and its contents, or a link to a public repository."
    validations:
      required: true
  - type: textarea
    id: output-got
    attributes:
      label: Output you got
      description: The command you ran and agentaudit's full output.
      render: text
    validations:
      required: true
  - type: textarea
    id: output-expected
    attributes:
      label: Output you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: agentaudit version
      description: "The output of `agentaudit --version`."
    validations:
      required: true
