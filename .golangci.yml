version: "2"

linters:
  default: standard
  enable:
    - gosec
  settings:
    gosec:
      excludes:
        # The credential-shaped names it flags are config keys and report
        # tokens, not secrets.
        - G101
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: "_test\\.go$"
        linters:
          - errcheck
      # Tests read files, set modes, run subprocesses and drop cleanup errors.
      - path: "_test\\.go$"
        text: "G(104|204|301|302|304|306)"
        linters:
          - gosec
