version: "2"

linters:
  default: standard
  enable:
    - gosec
  settings:
    gosec:
      excludes:
        # The credential-shaped names it flags are config keys and report
        # tokens, not secrets.
        - G101
  exclusions:
    presets:
      - std-error-handling
      - common-false-positives
    rules:
      - path: "_test\\.go$"
        linters:
          - errcheck
      # Tests discard cleanup errors, set fixture file modes and run
      # subprocesses.
      - path: "_test\\.go$"
        text: "G(104|204|301|302|306)"
        linters:
          - gosec
